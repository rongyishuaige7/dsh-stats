name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag and artifacts
        run: |
          release_version=$(node --print "require('./package.json').version")
          test "v${release_version}" = "$GITHUB_REF_NAME"
          npm run build
          npm test
          TZ=UTC npm test
          node --check lib/client.js
          node --check lib/index.js
          node --check lib/typert.host.js
          node --check lib/typert.remote-client.js
          npm pack --dry-run

      # prepublishOnly 会自动重新构建
      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
