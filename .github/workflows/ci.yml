name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build & verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Test timezone independence
        run: TZ=UTC npm test

      - name: Verify artifacts
        run: |
          node --check lib/client.js
          node --check lib/index.js
          node --check lib/typert.host.js
          node --check lib/typert.remote-client.js
          test -s lib/client.js
          test -s lib/index.js

      - name: Preview npm package
        run: npm pack --dry-run

      - name: Browser fixture
        run: npm run smoke:browser
        env:
          CHROME_BIN: /usr/bin/google-chrome
          DSH_SMOKE_OUTPUT: browser-results

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results
          path: browser-results
          if-no-files-found: ignore

  versions:
    name: Verified Harness versions
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.read.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: echo "list=$(jq -c . scripts/harness-versions.json)" >> "$GITHUB_OUTPUT"

  harness:
    name: Harness ${{ matrix.version }} contracts
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.versions.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install coherent published Harness modules
        run: node scripts/install-harness-fixture.mjs "${{ matrix.version }}" "$RUNNER_TEMP/harness"
      - name: Verify real persistence and projection contracts
        run: npm run smoke:harness
        env:
          DSH_HARNESS_ROOT: ${{ runner.temp }}/harness
