name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build & verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify artifacts
        run: |
          node --check lib/client.js
          node --check lib/index.js
          node --check lib/typert.host.js
          node --check lib/typert.remote-client.js
          test -s lib/client.js
          test -s lib/index.js
